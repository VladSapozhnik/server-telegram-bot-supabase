name: CI & Deploy Supabase

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Check & Lint Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Functions syntax and types
        run: |
          for dir in supabase/functions/*/; do
            if [ -f "${dir}index.ts" ]; then
              echo "Checking ${dir}..."
              deno check "${dir}index.ts" || echo "Warning on ${dir}"
            fi
          done

  deploy:
    name: Deploy to Supabase
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: "ugdxupwmgpmsgebbvpzx"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          else
            supabase link --project-ref "$PROJECT_ID"
          fi

      - name: Push Database Migrations
        if: env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase db push

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy --project-ref "$PROJECT_ID" --no-verify-jwt

